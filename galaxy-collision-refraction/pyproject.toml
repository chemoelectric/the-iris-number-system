[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-collision-refraction"
version = "0.1.3"
description = "Realistic interactive simulation of colliding spiral galaxies modeled as energy density clouds in wave refraction theory"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Barry Schwartz", email = "150643+chemoelectric@users.noreply.github.com" }
]
keywords = [
    "galaxy-collision",
    "spiral-galaxies",
    "astrophysics",
    "tidal-tails",
    "wave-refraction",
    "optics",
    "simulation",
    "pyglet",
    "dual-window"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pyglet>=2.0.0",
]

[project.scripts]
galaxy-collision-refraction = "galaxy_collision_refraction.app:main"

[project.urls]
Homepage = "https://github.com/chemoelectric/the-iris-number-system"
Repository = "https://github.com/chemoelectric/the-iris-number-system.git"
